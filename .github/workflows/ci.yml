name: Secure CI Pipeline

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  security-checks:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # Permissions lazmi hain taake Gitleaks aur CodeQL sahi se kaam karein
    permissions:
      contents: read
      security-events: write
      pull-requests: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Gitleaks ke liye poori history scan karna behtar hai

    # -------------------------------
    # 🔍 CodeQL: Static code analysis
    # -------------------------------
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: javascript-typescript # Combine languages for modern setup

    - name: Autobuild (CodeQL)
      uses: github/codeql-action/autobuild@v3

    - name: Run CodeQL Analysis
      uses: github/codeql-action/analyze@v3

    # -------------------------------
    # 🔍 Gitleaks
    # -------------------------------
    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # -------------------------------
    # 🔍 Trivy: Vulnerability scan
    # -------------------------------
    - name: Run Trivy (filesystem scan)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        severity: 'CRITICAL,HIGH'
        exit-code: '1'

  quality:
    needs: security-checks
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run lint
      run: npm run lint

    - name: Run unit tests
      run: npm test

    - name: Build NestJS app
      run: npm run build
