name: Secure CI Pipeline

on:
  pull_request:
    branches: [ dev, main ]

jobs:
  security-checks:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # Permissions lazmi hain taake Gitleaks aur CodeQL sahi se kaam karein
    permissions:
      contents: read
      security-events: write
      pull-requests: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Gitleaks ke liye poori history scan karna behtar hai

    # -------------------------------
    # 🔍 CodeQL: Static code analysis
    # -------------------------------
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: javascript-typescript # Combine languages for modern setup

    - name: Autobuild (CodeQL)
      uses: github/codeql-action/autobuild@v3

    - name: Run CodeQL Analysis
      uses: github/codeql-action/analyze@v3

    # -------------------------------
    # 🔍 Gitleaks: FIXED STEP ✅
    # -------------------------------
    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Ye missing tha!

    # -------------------------------
    # 🔍 Trivy: Vulnerability scan
    # -------------------------------
    - name: Run Trivy (filesystem scan)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        severity: 'CRITICAL,HIGH'
        exit-code: '1'

    # -------------------------------
    # Node.js setup + dependencies
    # -------------------------------
    - name: Install Node.js
      uses: actions/setup-node@v4 # Updated to v4
      with:
        node-version: '20'
        cache: 'npm' # Build fast karne ke liye caching zaroori hai
        cache-dependency-path: |
          backend/package-lock.json
          frontend/package-lock.json

    - name: Install Dependencies (Backend)
      run: |
        cd backend
        npm ci

    - name: Install Dependencies (Frontend)
      run: |
        cd frontend
        npm ci

  quality:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: |
          backend/package-lock.json
          frontend/package-lock.json

    - name: Install Dependencies (Backend)
      run: |
        cd backend
        npm ci

    - name: Install Dependencies (Frontend)
      run: |
        cd frontend
        npm ci

    - name: Backend tests
      run: |
        cd backend
        npm test

    - name: Backend build
      run: |
        cd backend
        npm run build

    - name: Frontend lint
      run: |
        cd frontend
        npm run lint

    - name: Frontend build
      run: |
        cd frontend
        npm run build
